services:
  database:
    image: postgres:18.6-trixie
    container_name: materiaq-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    ports:
      - "5432:5432"
    command: postgres -c default_toast_compression=lz4
    healthcheck:
      disable: false
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/docker/multiple-databases.sh:/docker-entrypoint-initdb.d/multiple-databases.sh

  valkey:
    image: valkey/valkey:9.1.2-alpine
    container_name: materiaq-valkey
    ports:
      - "6379:6379"
    command: valkey-server --requirepass ${VALKEY_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${VALKEY_PASSWORD} ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - valkey_data:/data

volumes:
  postgres_data:
  valkey_data:
